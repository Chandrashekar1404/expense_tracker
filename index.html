<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .main-container {
            /* border: 1px solid black; */
            height: 100vh;
        }

        .title-container {
            /* border: 1px solid black; */
            background-color: skyblue;
        }

        .title {
            margin-left: 10px;
        }

        .inputs {
            /* border: 1px solid black; */
            padding: 20px;
            margin-top: 10px;
            display: flex;
            /* justify-content: space-between; */
            box-shadow: 0px 0px 10px;
            margin: 20px;
            border-radius: 8px;
        }

        .input-group {
            margin: 10px;
        }

        .addbtn {
            margin: 10px;
            width: 100px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background-color: skyblue;

        }

        .cards {
            /* border: 1px solid black; */
            padding: 10px;
            display: flex;
            justify-content: space-around;
        }

        .card {
            background-color: skyblue;
            box-shadow: 0px 0px 10px;
        }

        .table-container{
            /* border: 1px solid black; */
            margin: 10px;
            padding: 10px;
        }

        .tr-table{
            /* border: 1px solid black; */
            width: 100%;
            background-color: skyblue;
        }
    </style>
</head>

<body>
    <div class="main-container">

        <div class="title-container">
            <h1 class="title">Expense Tracker</h1>
        </div>


        <div class="inputs">

            <div class="input-group flex-nowrap">

                <input type="date" id="date" class="form-control" placeholder="date" aria-label="Username"
                    aria-describedby="addon-wrapping">
            </div>

            <div class="input-group flex-nowrap">

                <input type="text" id="amount" class="form-control" placeholder="Enter Your Amount" aria-label="Username"
                    aria-describedby="addon-wrapping">
            </div>

            <select class="form-select tr-type" aria-label="Default select example" >
                <option selected>Select the Transaction type</option>
                <option value="income">Income</option>
                <option  value="expense">Expense</option>

            </select>

            <button onclick="addBtn()" class="addbtn">
                <h3>+</h3>
            </button>
        </div>


        <div class="cards">

            <div class="card" style="width: 18rem;">
                <div class="card-body">
                    <h5 class="card-title">Total Balance</h5>
                    <h3><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor"
                            class="bi bi-currency-rupee" viewBox="0 0 16 16">
                            <path
                                d="M4 3.06h2.726c1.22 0 2.12.575 2.325 1.724H4v1.051h5.051C8.855 7.001 8 7.558 6.788 7.558H4v1.317L8.437 14h2.11L6.095 8.884h.855c2.316-.018 3.465-1.476 3.688-3.049H12V4.784h-1.345c-.08-.778-.357-1.335-.793-1.732H12V2H4z" />
                        </svg><span id="tb">0</span></h3>

                </div>
            </div>

            <div class="card" style="width: 18rem;">
                <div class="card-body">
                    <h5 class="card-title">Total Expense</h5>
                    <h3><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor"
                            class="bi bi-currency-rupee" viewBox="0 0 16 16">
                            <path
                                d="M4 3.06h2.726c1.22 0 2.12.575 2.325 1.724H4v1.051h5.051C8.855 7.001 8 7.558 6.788 7.558H4v1.317L8.437 14h2.11L6.095 8.884h.855c2.316-.018 3.465-1.476 3.688-3.049H12V4.784h-1.345c-.08-.778-.357-1.335-.793-1.732H12V2H4z" />
                        </svg><span id="te">0</span></h3>

                </div>
            </div>

            <div class="card" style="width: 18rem;">
                <div class="card-body">
                    <h5 class="card-title">Total Income</h5>
                    <h3><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor"
                            class="bi bi-currency-rupee" viewBox="0 0 16 16">
                            <path
                                d="M4 3.06h2.726c1.22 0 2.12.575 2.325 1.724H4v1.051h5.051C8.855 7.001 8 7.558 6.788 7.558H4v1.317L8.437 14h2.11L6.095 8.884h.855c2.316-.018 3.465-1.476 3.688-3.049H12V4.784h-1.345c-.08-.778-.357-1.335-.793-1.732H12V2H4z" />
                        </svg><spa id="ti">0</spa></h3>

                </div>
            </div>

        </div>


        <div class="table-container">

            <table class="tr-table" id="tr-table">
                <tr>
                    <th>Date</th>
                    <th>Transaction Type</th>
                    <th>Amount</th>
                    <th>Action</th>
                </tr>


                <!-- rows added dynamically with js -->
            </table>

        </div>

    </div>


    <script>
        let transactionTable=document.getElementById("tr-table")


        function addBtn(){

            let date=document.getElementById("date").value
            let amount=document.getElementById("amount").value
            let transactionType=document.getElementsByClassName("tr-type")[0].value
          

            console.log(transactionType)

            // Updating table

            let row=document.createElement("tr");


            let datecell=document.createElement("td");
            datecell.innerText=date;


            let trcell=document.createElement("td")
            trcell.innerText=transactionType

            let amountcell=document.createElement("td")
            amountcell.innerText=amount


            let deletecell=document.createElement("td")

            let deletebtn=document.createElement("button")
            deletebtn.innerText="DELETE"
            deletebtn.onclick=()=>deleteRow(row)


            deletecell.appendChild(deletebtn)



            row.appendChild(datecell)
            row.appendChild(trcell)
            row.appendChild(amountcell)
            row.appendChild(deletecell)


            transactionTable.appendChild(row)



            // updating cards

            let totalBalance=document.getElementById("tb").innerText
            let totalExpense=document.getElementById("te").innerText
            let totalIncome=document.getElementById("ti").innerText

            // console.log(totalBalance,totalExpense,totalIncome)


            if(transactionType=="income"){

                if(totalBalance=="0"){
                    document.getElementById("tb").innerText=amount
                }else{
                    document.getElementById("tb").innerText = parseInt(totalBalance)+parseInt(amount)
                }


                 if(totalIncome=="0"){
                    document.getElementById("ti").innerText=amount
                }else{
                    document.getElementById("ti").innerText = parseInt(totalIncome)+parseInt(amount)
                }

            }else if(transactionType="expense"){

                     
                    document.getElementById("tb").innerText = parseInt(totalBalance)-parseInt(amount)

                    if(totalExpense=="0"){
                        document.getElementById("te").innerText=amount
                    }else{
                        document.getElementById("te").innerText = parseInt(totalExpense)+parseInt(amount)
                    }

            }


        }


        function deleteRow(row){
            row.remove()
        }


    </script>
</body>

</html>
